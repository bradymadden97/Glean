name: Build aarch64-darwin binary

on: [push, pull_request]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Remove _nixbld1 if exists (macOS only)
        if: runner.os == 'macOS'
        run: |
          if dscl . -read /Users/_nixbld1 &>/dev/null; then
            sudo dscl . -delete /Users/_nixbld1
          fi

      - name: Install Nix
        uses: cachix/install-nix-action@v25
        env:
          NIX_FIRST_BUILD_UID: "305" 

      - name: Build test binary for aarch64-darwin
        run: nix build .#test --system aarch64-darwin

      - name: Copy binary out of Nix store
        run: |
          mkdir -p out
          cp result/bin/test out/test-m1

      - name: Upload binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-m1
          path: out/test-m1

