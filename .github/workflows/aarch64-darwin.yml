name: Build aarch64-darwin binary

on: [push, pull_request]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Build test binary for aarch64-darwin
        run: nix build .#glean --system aarch64-darwin

      - name: Copy binary out of Nix store
        run: |
          mkdir -p out
          cp result/bin/glean out/

      - name: Upload binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: glean-m1
          path: out/glean
